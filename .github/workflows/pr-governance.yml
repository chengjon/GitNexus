name: PR Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-body-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Ensure PR base ref is available for governance diff
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
      - name: Validate PR body governance sections
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: node gitnexus/scripts/ci/repository-governance-check.mjs --mode pr-body --repo-root . --base-ref "origin/${PR_BASE_REF}" --event-path "$GITHUB_EVENT_PATH"
